<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48">
  <!-- Lemon body -->
  <circle cx="24" cy="24" r="20" fill="#FFF34D"/>
  <!-- Leaf -->
  <ellipse cx="30" cy="8" rx="7" ry="4" fill="#BFD857" transform="rotate(-30 30 8)"/>
  <!-- Eyes -->
  <ellipse cx="18" cy="22" rx="3" ry="3.5" fill="#333E48"/>
  <ellipse cx="30" cy="22" rx="3" ry="3.5" fill="#333E48"/>
  <!-- Angry brows -->
  <line x1="14" y1="17" x2="22" y2="19" stroke="#333E48" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="17" x2="26" y2="19" stroke="#333E48" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M16 30 Q24 26 32 30" stroke="#333E48" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- ZEST text -->
  <text x="52" y="21" font-family="Arial Black, sans-serif" font-weight="900" font-size="19" fill="#333E48" letter-spacing="1">ZEST</text>
  <!-- ATHLETIC text -->
  <text x="53" y="38" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#5A6A75" letter-spacing="2.5">ATHLETIC</text>
</svg>
